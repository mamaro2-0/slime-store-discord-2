<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SLIME STORE — Order Test</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; color: #efffee;
      background: radial-gradient(circle at top, #174d38, #07150f 65%); }
    main { max-width: 560px; margin: 32px auto; padding: 24px; border: 1px solid #3d9566;
      border-radius: 20px; background: rgba(7, 28, 19, .94); box-shadow: 0 15px 50px #0008; }
    h1 { margin-top: 0; color: #8cffb1; }
    p { color: #c5e8d1; line-height: 1.5; }
    label { display: block; margin: 14px 0 6px; font-weight: 650; }
    input, textarea, select { width: 100%; padding: 12px; border: 1px solid #4e8969;
      border-radius: 10px; color: #efffee; background: #10281d; font: inherit; }
    button { width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 12px;
      color: #062313; background: #8cffb1; font-weight: 800; font-size: 16px; }
    button:disabled { opacity: .6; }
    #result { margin-top: 16px; white-space: pre-wrap; }
    small { color: #a8cbb5; }
  </style>
</head>
<body>
<main>
  <h1>🟢 SLIME STORE</h1>
  <p>Order notification test form. Submitting this form sends an order notice to your Discord webhook.</p>
  <form id="orderForm">
    <label for="customerName">Customer name *</label>
    <input id="customerName" name="customerName" required maxlength="100">
    <label for="contact">Contact (Discord username) *</label>
    <input id="contact" name="contact" required maxlength="100">
    <label for="product">Product *</label>
    <input id="product" name="product" required maxlength="150" placeholder="Product name">
    <label for="paymentMethod">Payment method *</label>
    <select id="paymentMethod" name="paymentMethod" required>
      <option value="">Choose one</option>
      <option>GCash</option><option>Maya</option><option>GoTyme</option><option>PayPal</option>
    </select>
    <label for="reference">Payment reference</label>
    <input id="reference" name="reference" maxlength="150">
    <label for="receipt">Receipt image (optional, max 5 MB)</label>
    <input id="receipt" name="receipt" type="file" accept="image/png,image/jpeg,image/webp">
    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" rows="3" maxlength="500"></textarea>
    <button id="submitBtn" type="submit">Submit order</button>
  </form>
  <div id="result" role="status"></div>
  <small>Important: Discord notification does not verify payment. The seller must confirm payment in the official payment app before delivering a key.</small>
</main>
<script>
const form = document.getElementById("orderForm");
const result = document.getElementById("result");
const button = document.getElementById("submitBtn");
form.addEventListener("submit", async event => {
  event.preventDefault();
  result.textContent = "Submitting order...";
  button.disabled = true;
  try {
    const response = await fetch("/api/orders", { method: "POST", body: new FormData(form) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Order submission failed.");
    result.textContent = data.message;
    form.reset();
  } catch (error) {
    result.textContent = "Error: " + error.message;
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
